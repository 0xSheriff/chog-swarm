<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Pirata One';
          src: url('assets/fonts/PirataOne-Regular.ttf') format('truetype');
          font-weight: 400;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #030206;
          color: #efe6d2;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          overflow: hidden;
        }

        .bg-video-layer {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          opacity: 0.24;
          filter: saturate(1.1) brightness(0.65);
          pointer-events: none;
        }

        .stage-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at center, transparent 30%, #030206 85%);
          pointer-events: none;
        }

        #cold-stage {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 10;
          will-change: transform;
        }

        .logo-frame {
          position: relative;
          width: 170px;
          height: 170px;
          border-radius: 30px;
          overflow: hidden;
          border: 2px solid rgba(255, 122, 26, 0.5);
          box-shadow: 0 0 50px rgba(255, 122, 26, 0.3), 0 25px 50px rgba(0, 0, 0, 0.85);
          margin-bottom: 24px;
          background: #000000;
        }

        /* Rule A: Chog NFT displayed full image, no tint, no blur, original aspect ratio */
        .chog-logo-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        .sheen-light-sweep {
          position: absolute;
          top: -50%;
          left: 0;
          width: 60%;
          height: 200%;
          background: linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.35),
            transparent
          );
          transform: rotate(25deg);
          pointer-events: none;
        }

        .title-main {
          font-family: 'Pirata One', cursive, fantasy;
          font-size: 96px;
          letter-spacing: 0.04em;
          line-height: 1;
          color: #ff7a1a;
          text-shadow: 0 0 40px rgba(255, 122, 26, 0.5), 0 4px 14px rgba(0, 0, 0, 0.9);
          margin-bottom: 12px;
          text-align: center;
        }

        .title-sub {
          font-size: 28px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          font-weight: 600;
          color: #efe6d2;
          opacity: 0.9;
          margin-bottom: 20px;
          text-align: center;
        }

        .hook-text {
          font-size: 32px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #efe6d2;
          margin-bottom: 20px;
          text-align: center;
          text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .monad-pill {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 10px 22px;
          background: rgba(131, 110, 249, 0.14);
          border: 1px solid rgba(131, 110, 249, 0.4);
          border-radius: 9999px;
          font-size: 14px;
          font-weight: 600;
          color: #a99bfc;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }

        .monad-dot {
          width: 9px;
          height: 9px;
          border-radius: 50%;
          background: #836ef9;
          box-shadow: 0 0 12px #836ef9;
        }
      </style>

      <div id="root" data-composition-id="c0-cold-open" data-width="1920" data-height="1080">
        <video
          id="cold-bg"
          class="bg-video-layer"
          src="assets/media/halloween-background-loop.mp4"
          data-start="0"
          data-duration="8"
          muted
          playsinline
        ></video>
        <div class="stage-vignette"></div>

        <div id="cold-stage">
          <div id="cold-logo-wrap" class="logo-frame">
            <img class="chog-logo-img" src="assets/media/chog-logo.jpg" alt="Chog Genesis Flame Logo" />
            <div id="cold-logo-sheen" class="sheen-light-sweep"></div>
          </div>
          <h1 id="cold-title" class="title-main">CHOG SWARM</h1>
          <div id="cold-sub" class="title-sub" data-layout-ignore>HALLOWEEN EDITION • AUTONOMOUS PINBALL</div>
          <div id="cold-hook" class="hook-text" data-layout-ignore>THE NFT IS THE DRIVER, NOT THE BADGE</div>
          <div id="cold-pill" class="monad-pill" data-layout-ignore>
            <span class="monad-dot"></span>
            Monad Chain 143 • Verified Gate
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Continuous slow camera push-in and drift across 7.4 seconds
        tl.fromTo(
          "#cold-stage",
          { scale: 0.94, rotateZ: -0.6, y: 12 },
          { scale: 1.05, rotateZ: 0.6, y: -8, duration: 7.4, ease: "sine.inOut" },
          0.0
        );

        // Entrance reveals
        tl.fromTo(
          "#cold-logo-wrap",
          { scale: 0.85, opacity: 0.7, y: 15 },
          { scale: 1.0, opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
          0.0
        );

        tl.fromTo(
          "#cold-title",
          { opacity: 0.6, y: 12 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
          0.0
        );

        tl.fromTo(
          "#cold-sub",
          { opacity: 0, y: 15 },
          { opacity: 0.9, y: 0, duration: 0.6, ease: "power2.out" },
          0.6
        );

        tl.fromTo(
          "#cold-hook",
          { opacity: 0, scale: 0.95 },
          { opacity: 1, scale: 1.0, duration: 0.7, ease: "back.out(1.2)" },
          1.4
        );

        tl.fromTo(
          "#cold-pill",
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1.0, duration: 0.5, ease: "power2.out" },
          2.0
        );

        // Specular light sweep across Flame Chog logo using transform x
        tl.fromTo(
          "#cold-logo-sheen",
          { x: -220 },
          { x: 320, duration: 1.2, ease: "power2.inOut" },
          2.2
        );

        tl.fromTo(
          "#cold-logo-sheen",
          { x: -220 },
          { x: 320, duration: 1.2, ease: "power2.inOut", immediateRender: false },
          5.0
        );

        // Smooth transition out into Scene 1 without overlapping scale
        tl.to(
          "#cold-stage",
          { opacity: 0, duration: 0.6, ease: "power3.in" },
          7.4
        );

        window.__timelines["c0-cold-open"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
