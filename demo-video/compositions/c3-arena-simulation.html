<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Pirata One';
          src: url('assets/fonts/PirataOne-Regular.ttf') format('truetype');
          font-weight: 400;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          perspective: 1400px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #030206;
          color: #efe6d2;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          overflow: hidden;
        }

        .bg-video-layer {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          opacity: 0.28;
          filter: saturate(1.1) brightness(0.65);
          pointer-events: none;
        }

        .stage-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at center, transparent 35%, #030206 90%);
          pointer-events: none;
        }

        .browser-viewport-wrapper {
          position: relative;
          width: 1400px;
          height: 840px;
          transform-style: preserve-3d;
        }

        .browser-window {
          position: absolute;
          inset: 0;
          border-radius: 16px;
          background: rgba(10, 7, 18, 0.95);
          border: 1px solid rgba(255, 255, 255, 0.12);
          box-shadow: 0 45px 120px rgba(0, 0, 0, 0.9), 0 0 60px rgba(255, 122, 26, 0.12);
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }

        .browser-chrome-bar {
          height: 48px;
          background: rgba(20, 15, 32, 0.95);
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
          display: flex;
          align-items: center;
          padding: 0 18px;
          gap: 16px;
        }

        .traffic-lights {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .traffic-dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .url-bar {
          flex: 1;
          max-width: 480px;
          height: 28px;
          background: rgba(0, 0, 0, 0.4);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 6px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
          color: rgba(239, 230, 210, 0.6);
          font-family: monospace;
          letter-spacing: 0.02em;
        }

        .browser-content {
          flex: 1;
          position: relative;
          background: #0a0712;
          overflow: hidden;
        }

        .real-footage-video {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        /* High-fidelity Vector Cursor Decoupled Layer */
        .vector-cursor {
          position: absolute;
          top: 0;
          left: 0;
          width: 32px;
          height: 32px;
          pointer-events: none;
          z-index: 50;
          transform: translate3d(0, 0, 0);
          filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.65));
          opacity: 0;
        }

        .vector-cursor svg {
          width: 100%;
          height: 100%;
          display: block;
        }

        .cursor-ripple {
          position: absolute;
          top: 0;
          left: 0;
          width: 44px;
          height: 44px;
          margin-top: -22px;
          margin-left: -22px;
          border-radius: 50%;
          border: 2px solid #ff7a1a;
          box-shadow: 0 0 16px #ff7a1a, inset 0 0 8px rgba(255, 122, 26, 0.4);
          opacity: 0;
          pointer-events: none;
          transform: scale(0.2);
          z-index: 49;
        }

        .step-badge {
          position: absolute;
          top: 60px;
          left: 80px;
          display: flex;
          align-items: center;
          gap: 16px;
          z-index: 25;
        }

        .step-number {
          font-family: 'Pirata One', cursive;
          font-size: 64px;
          color: #ff7a1a;
          line-height: 1;
          text-shadow: 0 0 25px rgba(255, 122, 26, 0.5);
        }

        .step-label {
          font-size: 18px;
          font-weight: 700;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          color: #efe6d2;
        }

        .overlay-card {
          position: absolute;
          bottom: 70px;
          right: 80px;
          max-width: 520px;
          padding: 24px 32px;
          background: rgba(10, 7, 18, 0.92);
          backdrop-filter: blur(20px);
          border: 1px solid rgba(255, 122, 26, 0.35);
          border-radius: 16px;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 122, 26, 0.2);
          z-index: 25;
          opacity: 0;
        }

        .card-tag {
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #ff7a1a;
          margin-bottom: 8px;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .card-tag::before {
          content: '';
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #ff7a1a;
        }

        .card-title {
          font-family: 'Pirata One', cursive;
          font-size: 40px;
          line-height: 1.05;
          color: #efe6d2;
          margin-bottom: 8px;
        }

        .card-body {
          font-size: 16px;
          line-height: 1.5;
          color: rgba(239, 230, 210, 0.75);
        }
      </style>

      <div id="root" data-composition-id="c3-arena-simulation" data-width="1920" data-height="1080">
        <video
          id="c3-bg-loop"
          class="bg-video-layer"
          src="assets/media/halloween-background-loop.mp4"
          data-start="0"
          data-duration="28"
          muted
          playsinline
        ></video>
        <div class="stage-vignette"></div>

        <div id="c3-step" class="step-badge" data-layout-ignore>
          <div class="step-number">02</div>
          <div class="step-label">DETERMINISTIC ARENA SIMULATION</div>
        </div>

        <div id="c3-browser" class="browser-viewport-wrapper" data-layout-allow-overflow>
          <div class="browser-window">
            <div class="browser-chrome-bar">
              <div class="traffic-lights">
                <span class="traffic-dot dot-red"></span>
                <span class="traffic-dot dot-yellow"></span>
                <span class="traffic-dot dot-green"></span>
              </div>
              <div class="url-bar" data-layout-ignore data-layout-allow-overflow>https://chog-swarm.netlify.app/arena</div>
            </div>
            <div class="browser-content">
              <video
                id="c3-footage"
                class="real-footage-video"
                src="assets/media/scene3-arena-race-finish.mp4"
                data-start="0"
                data-duration="28"
                muted
                playsinline
              ></video>

              <!-- Vector Cursor Overlay -->
              <div id="c3-cursor" class="vector-cursor">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87c.45 0 .67-.54.35-.85L6.35 2.85a.5.5 0 0 0-.85.36z" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
              </div>
              <div id="c3-ripple" class="cursor-ripple"></div>
            </div>
          </div>
        </div>

        <div id="c3-card" class="overlay-card">
          <div class="card-tag" data-layout-ignore>Pure State Engine</div>
          <div class="card-title">ZERO CLIENT-SIDE MANIPULATION</div>
          <div class="card-body" data-layout-ignore>
            Identical seed and policy produce identical physics ticks every run.
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Forward entrance, deep immersion
        tl.fromTo(
          "#c3-browser",
          { rotateX: 6, rotateY: -6, scale: 0.92, opacity: 0 },
          { rotateX: 3, rotateY: -3, scale: 1.05, opacity: 1, duration: 1.4, ease: "power3.out" },
          0.0
        );

        tl.fromTo(
          "#c3-step",
          { y: -30, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" },
          0.4
        );

        // Slow camera drift across table from 1.4s to 16.0s
        tl.to(
          "#c3-browser",
          { rotateX: 1, rotateY: 1, scale: 1.15, duration: 14.6, ease: "sine.inOut" },
          1.4
        );

        // Vector cursor tracking ball action across table
        tl.fromTo(
          "#c3-cursor",
          { x: 680, y: 690, opacity: 0 },
          { x: 700, y: 710, opacity: 1, duration: 0.6, ease: "power2.out" },
          0.6
        );

        // Hit start race
        tl.fromTo(
          "#c3-ripple",
          { x: 700, y: 710, scale: 0.2, opacity: 0.95 },
          { scale: 1.8, opacity: 0, duration: 0.5, ease: "power2.out" },
          1.2
        );

        // Ball tracking motion
        tl.to("#c3-cursor", { x: 720, y: 450, duration: 1.8, ease: "power2.inOut" }, 1.8);
        tl.to("#c3-cursor", { x: 640, y: 520, duration: 3.2, ease: "sine.inOut" }, 4.0);
        tl.to("#c3-cursor", { x: 780, y: 380, duration: 4.5, ease: "power1.inOut" }, 8.0);
        tl.to("#c3-cursor", { x: 700, y: 320, duration: 3.5, ease: "power2.inOut" }, 13.0);

        // Zoom in to inspect finish / celebration at 16.0s
        tl.to(
          "#c3-browser",
          { rotateX: 0, rotateY: 0, scale: 1.25, y: -40, duration: 1.4, ease: "power3.inOut" },
          16.0
        );

        // Headline card reveal
        tl.fromTo(
          "#c3-card",
          { x: 50, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
          16.8
        );

        // CRUCIAL: Continuous camera push-in and drift through the entire finish / celebration (17.4s - 27.4s)
        // This eliminates the 73s - 83s dead stretch!
        tl.to(
          "#c3-browser",
          { scale: 1.32, y: -60, x: -15, duration: 10.0, ease: "sine.inOut" },
          17.4
        );

        // Celebration badge click & pulse
        tl.to("#c3-cursor", { x: 720, y: 340, duration: 2.0, ease: "power2.inOut" }, 20.0);
        tl.fromTo(
          "#c3-ripple",
          { x: 720, y: 340, scale: 0.2, opacity: 0.95 },
          { scale: 2.0, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false },
          22.5
        );
        tl.to("#c3-cursor", { scale: 0.88, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.inOut" }, 22.5);
        tl.to("#c3-cursor", { x: 760, y: 400, duration: 3.0, ease: "sine.inOut" }, 23.5);

        // Transition out
        tl.to(
          "#c3-browser, #c3-card, #c3-step",
          { opacity: 0, scale: 0.95, duration: 0.6, ease: "power2.in" },
          27.4
        );

        window.__timelines["c3-arena-simulation"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
