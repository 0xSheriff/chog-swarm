<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Chog Swarm: Gate 1 Motion Test</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030206;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <!-- Procedural Audio Stems -->
      <audio id="audio-bed" src="assets/media/music-bed.wav" data-start="0" data-duration="10"></audio>
      <audio id="audio-rollover" src="assets/media/rollover.wav" data-start="1.2" data-duration="0.5"></audio>
      <audio id="audio-tick" src="assets/media/ui-tick.wav" data-start="7.6" data-duration="0.1"></audio>

      <!-- Sub-Composition 0: Cold Open (0s - 3s) -->
      <div
        id="cold-open"
        data-composition-id="cold-open"
        data-composition-src="compositions/cold-open.html"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Sub-Composition 1: 3D Stage & Real Capture Push-in (3s - 10s) -->
      <div
        id="stage"
        data-composition-id="stage"
        data-composition-src="compositions/stage.html"
        data-start="3"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
