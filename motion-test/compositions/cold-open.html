<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Pirata One';
          src: url('assets/fonts/PirataOne-Regular.ttf') format('truetype');
          font-weight: 400;
          font-style: normal;
        }

        #root {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at center, #150d26 0%, #030206 75%);
          color: #efe6d2;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          overflow: hidden;
        }

        .logo-frame {
          width: 160px;
          height: 160px;
          border-radius: 28px;
          overflow: hidden;
          border: 2px solid rgba(255, 122, 26, 0.45);
          box-shadow: 0 0 50px rgba(255, 122, 26, 0.28), 0 20px 40px rgba(0, 0, 0, 0.8);
          margin-bottom: 28px;
          background: #000000;
        }

        /* Rule A: Chog NFT displayed full image, no tint, no blur, original aspect ratio */
        .chog-logo-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        .title-main {
          font-family: 'Pirata One', cursive, fantasy;
          font-size: 88px;
          letter-spacing: 0.04em;
          line-height: 1;
          color: #ff7a1a;
          text-shadow: 0 0 35px rgba(255, 122, 26, 0.5), 0 4px 12px rgba(0, 0, 0, 0.9);
          margin-bottom: 14px;
          text-align: center;
        }

        .title-sub {
          font-size: 28px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          font-weight: 600;
          color: #efe6d2;
          opacity: 0.85;
          margin-bottom: 20px;
          text-align: center;
        }

        .monad-pill {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 8px 18px;
          background: rgba(131, 110, 249, 0.12);
          border: 1px solid rgba(131, 110, 249, 0.35);
          border-radius: 9999px;
          font-size: 13px;
          font-weight: 600;
          color: #a99bfc;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }

        .monad-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #836ef9;
          box-shadow: 0 0 10px #836ef9;
        }
      </style>

      <div id="root" data-composition-id="cold-open" data-width="1920" data-height="1080">
        <div id="cold-logo-wrap" class="logo-frame">
          <img class="chog-logo-img" src="assets/media/chog-logo.jpg" alt="Chog Genesis Flame Logo" />
        </div>
        <h1 id="cold-title" class="title-main">CHOG SWARM</h1>
        <div id="cold-sub" class="title-sub">HALLOWEEN EDITION • AUTONOMOUS PINBALL</div>
        <div id="cold-pill" class="monad-pill" data-layout-ignore>
          <span class="monad-dot"></span>
          Monad Chain 143 • Verified Gate
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          "#cold-logo-wrap",
          { scale: 0.85, opacity: 0.7, y: 15 },
          { scale: 1.0, opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
          0.0
        );

        tl.fromTo(
          "#cold-title",
          { opacity: 0.6, y: 10 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
          0.0
        );

        tl.fromTo(
          "#cold-sub",
          { opacity: 0, y: 12 },
          { opacity: 0.85, y: 0, duration: 0.5, ease: "power2.out" },
          0.4
        );

        tl.fromTo(
          "#cold-pill",
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1.0, duration: 0.5, ease: "power2.out" },
          0.7
        );

        tl.to(
          "#cold-logo-wrap, #cold-title, #cold-sub, #cold-pill",
          { opacity: 0, scale: 0.92, duration: 0.4, ease: "power3.in" },
          2.6
        );

        window.__timelines["cold-open"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
